name: Windows source checks
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: USPK_Project_Front/USPK_Project_Front/package-lock.json
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "PowerShell syntax error in $($_.FullName): $errors" }
          }
      - name: Build backend
        run: dotnet build USPK_Project/USPK_Project/USPK_Project.csproj --nologo
      - name: Install frontend
        working-directory: USPK_Project_Front/USPK_Project_Front
        run: npm ci
      - name: Lint frontend
        working-directory: USPK_Project_Front/USPK_Project_Front
        run: npm run lint
      - name: Build frontend
        working-directory: USPK_Project_Front/USPK_Project_Front
        run: npm run build
